<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="GARBAGE DAY: a dark comedy horror feature film pitch.">
<title>Garbage Day</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: a framed click-through deck. Fixed header + footer, one slide at a time in the stage.
   Section slides reuse the deck's purple-ruled grid; character slides reuse its offset box + framed portrait. */
:root{
  --bg:#231f20;          /* the deck's warm near-black */
  --bg-deep:#161314;
  --rule:#4c3e9f;        /* the deck's purple frame */
  --rule-hi:#a397ff;     /* lifted purple for small text on dark */
  --ink:#f6f3f8;
  --ink-soft:#c3bcc8;
  --glow-blue:#3b5bff; --glow-gold:#f0b543; --glow-violet:#9b3bff;
  --f-display:"Anton","Impact","Haettenschweiler","Arial Narrow Bold",sans-serif;
  --f-body:"Source Sans 3","Myriad Pro","Segoe UI",system-ui,sans-serif;
  --line:3px;
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:dark;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rule-hi);outline-offset:3px}

/* film grain, filled in by script */
body::after{content:"";position:fixed;inset:-50%;pointer-events:none;z-index:50;background-image:var(--grain,none);opacity:.07;animation:grain 1.2s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- chrome ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;min-height:56px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.02em;line-height:1}
.label{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--rule-hi)}
.btn{display:inline-flex;align-items:center;gap:8px;background:transparent;border:var(--line) solid var(--rule);padding:6px 14px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;transition:background .25s,border-color .25s}
.btn:hover{background:var(--rule)}
.foot{gap:20px}
.foot .now{flex:0 1 220px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticks{flex:1;display:flex;gap:4px;min-width:0;max-width:560px}
.ticks button{flex:1;height:22px;padding:0;border:0;background:none;cursor:pointer;position:relative}
.ticks button::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;transform:translateY(-50%);background:rgba(163,151,255,.22);transition:background .3s,height .3s}
.ticks button.past::before{background:rgba(163,151,255,.55)}
.ticks button.on::before{background:var(--rule-hi);height:5px}
.ticks button:hover::before{background:var(--ink)}
.pager{display:flex;align-items:center;gap:10px}
.count{font-family:var(--f-display);font-size:18px;letter-spacing:.04em;font-variant-numeric:tabular-nums;min-width:4.6em;text-align:center}
.count span{color:var(--ink-soft)}
.arrow{width:44px;height:40px;display:grid;place-items:center;background:transparent;border:var(--line) solid var(--rule);cursor:pointer;transition:background .25s,opacity .25s}
.arrow:hover{background:var(--rule)}
.arrow:disabled{opacity:.3;cursor:default;background:transparent}
.arrow svg{width:18px;height:18px}

/* ---------- stage + slides ---------- */
.stage{position:relative;min-height:0}
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;visibility:hidden;opacity:0;transition:opacity .45s ease,visibility 0s linear .5s;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.slide.is-active{visibility:visible;opacity:1;z-index:2;transition:opacity .6s ease .12s}
.slide.is-leaving{visibility:visible;opacity:0;z-index:1;transition:opacity .45s ease}
.slide.is-leaving .px{transition:transform .5s}
.slide.from-right{animation:inRight .7s cubic-bezier(.2,.7,.1,1) both}
.slide.from-left{animation:inLeft .7s cubic-bezier(.2,.7,.1,1) both}
@keyframes inRight{from{transform:translate3d(48px,0,0)}to{transform:none}}
@keyframes inLeft{from{transform:translate3d(-48px,0,0)}to{transform:none}}
.stage{touch-action:pan-y}
.slide.dragging{will-change:transform}
.swipe-hint{display:none}
@media (hover:none) and (pointer:coarse){
  .hint{display:none}
  .swipe-hint{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
  .swipe-hint i{display:block;width:26px;height:2px;background:var(--rule-hi);position:relative;animation:nudge 1.8s ease-in-out infinite}
  .swipe-hint i::after{content:"";position:absolute;right:-1px;top:-3px;width:8px;height:8px;border-top:2px solid var(--rule-hi);border-right:2px solid var(--rule-hi);transform:rotate(45deg)}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
}

/* parallax: pointer drives --mx/--my on :root, scroll drives --sy per element */
.px{translate:calc(var(--mx,0) * var(--d,10) * 1px) calc(var(--my,0) * var(--d,10) * 1px + var(--sy,0px))}

/* load-in */
.is-active .rv{animation:rise .95s var(--ease) both;animation-delay:calc(var(--i,0) * 110ms + 180ms)}
.is-active .rv-img{animation:wipe 1.15s cubic-bezier(.75,0,.2,1) both;animation-delay:calc(var(--i,0) * 110ms + 120ms)}
.is-active .rv-img img{animation:settle 1.8s var(--ease) both;animation-delay:calc(var(--i,0) * 110ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes wipe{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes settle{from{scale:1.32;filter:brightness(.4) saturate(.6)}}

/* ---------- title slide ---------- */
.hero{padding-block:4px 10px}
.hero-frame{position:relative;height:100%;min-height:320px;overflow:hidden;border:var(--line) solid var(--rule);background:var(--bg-deep);isolation:isolate}
.hero-bg{position:absolute;inset:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;scale:1.12}
.hero-glow{position:absolute;inset:-20%;mix-blend-mode:screen;opacity:.38;pointer-events:none;
  background:radial-gradient(40% 35% at 30% 40%,var(--glow-blue),transparent 70%),radial-gradient(35% 30% at 70% 55%,var(--glow-gold),transparent 70%),radial-gradient(45% 40% at 55% 30%,var(--glow-violet),transparent 70%);
  animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}100%{transform:rotate(-6deg) scale(1.02)}}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,19,20,0) 45%,rgba(22,19,20,.75) 100%)}
.hero-logo{position:absolute;left:50%;top:56%;width:min(62%,780px);transform:translate(-50%,-50%) rotate(-2deg);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.hero-logo-shade{position:absolute;left:50%;top:56%;width:min(70%,880px);aspect-ratio:1.6;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(10,8,12,.55),transparent);pointer-events:none}
.hero.is-active .hero-logo{animation:logoIn 1.4s var(--ease) both .35s}
@keyframes logoIn{from{opacity:0;transform:translate(-50%,-44%) rotate(-7deg) scale(.86)}to{opacity:1;transform:translate(-50%,-50%) rotate(-2deg) scale(1)}}
.hero.is-active .hero-bg{animation:bgIn 2.4s var(--ease) both}
@keyframes bgIn{from{opacity:0;transform:scale(1.12)}}
.hero-meta{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding:clamp(16px,3vw,36px)}
.hero-meta p{margin:0;max-width:30ch}
.hero-meta .kicker{font-family:var(--f-display);font-size:clamp(20px,2.2vw,30px);line-height:1.1;letter-spacing:.02em;text-transform:uppercase}
.hero-meta .label{display:block;margin-bottom:6px}
.begin{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.begin:hover{background:var(--rule-hi);border-color:var(--rule-hi)}
.hint{font-size:12px;color:var(--ink-soft);margin-top:8px !important}

/* ---------- section slides ---------- */
.sec{padding-block:4px 10px}
.sec-grid{height:100%;display:grid;gap:var(--line);background:var(--rule);border:var(--line) solid var(--rule);
  grid-template-columns:minmax(0,.74fr) minmax(0,1fr);grid-template-rows:repeat(3,minmax(0,1fr));grid-template-areas:"t a" "x b" "x c"}
.cell{background:var(--bg);min-width:0;min-height:0;position:relative;overflow:hidden}
.cell-title{grid-area:t;display:grid;place-items:center;container-type:size}
.cell-title h2{margin:0;font-family:var(--f-display);font-weight:400;line-height:.9;letter-spacing:.005em;text-transform:uppercase;font-size:min(calc(var(--fs) * 1cqw),66cqh)}
.cell-text{grid-area:x;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.cell-text .in{padding:clamp(20px,2.6vw,44px);max-width:62ch}
.cell-text p{margin:0 0 1em;font-size:clamp(15px,.55vw + 10px,19px);line-height:1.55;color:var(--ink)}
.cell-text.dense p{font-size:clamp(14px,.4vw + 9.5px,17px);line-height:1.55}
.cell-text p:last-child{margin-bottom:0}
.lead{font-family:var(--f-display);font-size:clamp(20px,1.5vw + 6px,30px) !important;line-height:1.12 !important;text-transform:uppercase;letter-spacing:.01em;color:var(--rule-hi) !important}
.cell-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;scale:1.12}
.cell-img.a{grid-area:a}.cell-img.b{grid-area:b}.cell-img.c{grid-area:c}

/* ---------- character slides ---------- */
.char{display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding-block:8px 16px}
.char-wrap{position:relative;width:min(1080px,100%,calc((100svh - 190px) * 1.477));aspect-ratio:610/413;container-type:inline-size}
.char-box{position:absolute;left:0;top:0;width:54.6%;height:85%;border:var(--line) solid var(--rule);background:var(--bg);padding:4.4cqw 10cqw 3cqw 4.6cqw;overflow:hidden}
.char-box .label{font-size:max(10px,1.05cqw)}
.char-box h2{margin:.5cqw 0 2.2cqw;font-family:var(--f-display);font-weight:400;text-transform:uppercase;line-height:.92;font-size:calc(var(--fs) * 1cqw);text-wrap:balance}
.char-box p{margin:0;font-size:clamp(13px,1.75cqw,19px);line-height:1.5;max-width:46ch}
.char-img{position:absolute;left:49.2%;top:25.2%;width:50.8%;height:74.8%;margin:0;border:var(--line) solid var(--rule);background:var(--bg-deep);overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.char-img img{width:100%;height:100%;object-fit:cover;scale:1.1;display:block}

/* ---------- concept art ---------- */
.art{display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding-block:8px 16px}
.art-wrap{width:min(1120px,100%);display:grid;gap:clamp(18px,3vh,36px)}
.art-title{justify-self:start;border:var(--line) solid var(--rule);padding:clamp(10px,1.6vw,20px) clamp(16px,2.4vw,30px)}
.art-title h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,5.4vw,80px);line-height:.95;text-transform:uppercase}
.art-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.6vw,22px);width:min(100%,calc((100svh - 400px) * .773 * 4 + 66px));justify-self:center}
.art-card{position:relative;aspect-ratio:1275/1650;max-width:100%;padding:0;border:var(--line) solid var(--rule);background:#fff;cursor:zoom-in;overflow:hidden}
.art-card img{width:100%;height:100%;object-fit:cover;display:block;scale:1.04;transition:scale .6s var(--ease)}
.art-card:hover img{scale:1.1}
.art-card span{position:absolute;left:0;bottom:0;background:var(--rule);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.16em;padding:4px 8px;font-variant-numeric:tabular-nums}
.art-note{margin:0;color:var(--ink-soft);font-size:14px}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(22,19,20,.94);backdrop-filter:blur(6px);display:grid;opacity:0;transition:opacity .3s;
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay.open{opacity:1}
.overlay .close{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.index-inner{align-self:center;justify-self:center;width:min(980px,100%);display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));max-height:100%;overflow:auto;padding-top:48px}
.index-col h3{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--rule-hi)}
.index-col ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.index-col button{width:100%;display:flex;gap:14px;align-items:baseline;text-align:left;background:none;border:0;border-bottom:1px solid rgba(76,62,159,.5);padding:8px 2px;cursor:pointer;font-family:var(--f-display);font-size:clamp(22px,2.4vw,30px);text-transform:uppercase;line-height:1.1;transition:color .2s,padding .3s var(--ease)}
.index-col button small{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;min-width:2ch}
.index-col button:hover,.index-col button[aria-current="true"]{color:var(--rule-hi);padding-left:10px}
.lightbox figure{margin:0;align-self:center;justify-self:center;display:grid;gap:10px;justify-items:center;max-height:100%}
.lightbox img{max-height:calc(100svh - 140px);max-width:100%;border:var(--line) solid var(--rule);background:#fff}
.lightbox .lb-nav{display:flex;gap:10px;align-items:center}

/* ---------- compact layout: phones, narrow windows, short landscape ---------- */
@media (max-width:860px),(max-height:560px){
  .foot .now{display:none}
  .brand .label{display:none}
  .sec-grid{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"t" "a" "x" "b" "c"}
  .cell-title{container-type:inline-size;padding:28px 16px 22px}
  .cell-title h2{font-size:min(calc(var(--fs) * 1cqw),120px)}
  .cell-text{overflow:visible}
  .cell-img{aspect-ratio:16/10}
  .cell-img img{scale:1.2}
  .char{place-items:start center}
  .char-wrap{aspect-ratio:auto;width:100%;max-width:560px;padding-bottom:8px}
  .char-box{position:relative;width:100%;height:auto;padding:24px 22px 76px}
  .char-box h2{font-size:min(calc(var(--fs) * 1.8cqw),88px);margin:6px 0 14px}
  .char-box p{font-size:16px}
  .char-box .label{font-size:11px}
  .char-img{position:relative;left:auto;top:auto;width:82%;height:auto;aspect-ratio:1;margin:-56px 0 0 auto}
  .art{place-items:start center}
  .art-grid{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
  .hero-logo{width:min(86%,560px);top:46%}
  .hero-logo-shade{width:96%;top:46%}
}
@media (max-width:520px){
  .foot{gap:12px}
  .count{min-width:3.8em;font-size:16px}
  .arrow{width:40px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .px{translate:none}
}

/* ---------- password gate ---------- */
#site{height:100%}
.gate{position:fixed;inset:0;z-index:60;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;background:var(--bg);
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transition:opacity .6s ease}
.gate.out{opacity:0;pointer-events:none}
.gate::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;
  background:radial-gradient(40% 35% at 30% 40%,var(--glow-blue),transparent 70%),radial-gradient(35% 30% at 70% 60%,var(--glow-gold),transparent 70%),radial-gradient(45% 40% at 55% 30%,var(--glow-violet),transparent 70%);
  animation:drift 14s ease-in-out infinite alternate}
.gate-box{position:relative;width:min(440px,100%);border:var(--line) solid var(--rule);background:var(--bg);padding:clamp(24px,5vw,40px);display:grid;grid-template-columns:minmax(0,1fr);gap:14px;animation:rise .9s var(--ease) both .1s}
.gate-box h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(48px,12vw,76px);line-height:.9;text-transform:uppercase}
.gate-box p{margin:0;color:var(--ink-soft)}
.gate-row{display:flex;gap:8px}
.gate-row input{flex:1;min-width:0;background:var(--bg-deep);border:var(--line) solid var(--rule);color:var(--ink);font:inherit;font-size:16px;padding:10px 12px;border-radius:0}
.gate-row input:focus{outline:none;border-color:var(--rule-hi)}
.gate-row .btn{padding:10px 18px}
.gate-msg{min-height:1.5em;font-size:14px;color:#ff9a9a !important}
.gate-box.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="gate-box" id="gate-form">
    <span class="label">Feature film pitch</span>
    <h1>Garbage Day</h1>
    <p>This pitch is private. Enter the password to view it.</p>
    <label class="label" for="gate-pw">Password</label>
    <div class="gate-row">
      <input id="gate-pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
      <button class="btn begin" type="submit" id="gate-btn">Enter</button>
    </div>
    <p class="gate-msg" id="gate-msg" role="alert"></p>
  </form>
</div>
<div id="site"></div>

  const SALT = "GJTCHu2Yi3gc1eFMUdvbTw==", ITER = 250000;
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const form = document.getElementById('gate-form'), input = document.getElementById('gate-pw');
  const btn = document.getElementById('gate-btn'), msg = document.getElementById('gate-msg');

  async function deriveKey(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  const dec = (key, buf) => crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));

  async function unlock(pw) {
    const key = await deriveKey(pw);
    const data = JSON.parse(new TextDecoder().decode(await dec(key, b64(P))));  // throws on a wrong password
    const paths = [...new Set([...data.html.matchAll(/data-enc="([^"]+)"/g)].map(m => m[1]))];
    const urls = {};
    await Promise.all(paths.map(async p => {
      const r = await fetch(p);
      if (!r.ok) throw new Error('load');
      const bytes = new Uint8Array(await r.arrayBuffer());
      urls[p] = URL.createObjectURL(new Blob([await dec(key, bytes)], { type: 'image/webp' }));
    }));
    document.getElementById('site').innerHTML = data.html.replace(/data-enc="([^"]+)"/g, (_, p) => 'src="' + urls[p] + '"');
    const s = document.createElement('script'); s.textContent = data.js; document.body.appendChild(s);
    const gate = document.getElementById('gate');
    gate.classList.add('out'); setTimeout(() => gate.remove(), 650);
    try { sessionStorage.setItem('gd-pass', pw); } catch (e) {}
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = 'Opening…'; msg.textContent = '';
    try { await unlock(input.value); }
    catch (err) {
      btn.disabled = false; btn.textContent = 'Enter';
      msg.textContent = err && err.message === 'load'
        ? 'The images didn’t load. Check your connection and try again.'
        : 'That password didn’t work. Check it and try again.';
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      input.select();
    }
  });

  let saved = null;
  try { saved = sessionStorage.getItem('gd-pass'); } catch (e) {}
  if (saved) unlock(saved).catch(() => { try { sessionStorage.removeItem('gd-pass'); } catch (e) {} input.focus(); });
